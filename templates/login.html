<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border:1px solid #e2e2de;border-radius:12px;padding:2.5rem 2rem;
  max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{height:64px;width:auto;object-fit:contain;margin-bottom:1.5rem}
h1{font-size:19px;font-weight:700;color:#1a1a18;margin-bottom:6px}
p.sub{font-size:13px;color:#666662;margin-bottom:2rem}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:11px 16px;border:1px solid #dadce0;border-radius:8px;
  background:#fff;color:#3c4043;font-size:14px;font-weight:500;cursor:pointer;
  text-decoration:none;transition:box-shadow .15s,background .15s}
.google-btn:hover{box-shadow:0 1px 4px rgba(0,0,0,.15);background:#f8f9fa}
.google-icon{width:18px;height:18px;flex-shrink:0}
.error-box{background:#fff0f0;color:#a02020;border:1px solid #f5c6c6;border-radius:8px;
  padding:12px 14px;font-size:13px;margin-bottom:1.5rem;text-align:left;line-height:1.5}
.footer-note{font-size:11px;color:#99998f;margin-top:1.75rem}
