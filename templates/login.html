<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kata — Iniciar sesión</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border:1px solid #e2e2de;border-radius:12px;padding:2.5rem 2rem;
  max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{height:64px;width:auto;object-fit:contain;margin-bottom:1.5rem}
h1{font-size:19px;font-weight:700;color:#1a1a18;margin-bottom:6px}
p.sub{font-size:13px;color:#666662;margin-bottom:2rem}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:11px 16px;border:1px solid #dadce0;border-radius:8px;
  background:#fff;color:#3c4043;font-size:14px;font-weight:500;cursor:pointer;
  text-decoration:none;transition:box-shadow .15s,background .15s}
.google-btn:hover{box-shadow:0 1px 4px rgba(0,0,0,.15);background:#f8f9fa}
.google-icon{width:18px;height:18px;flex-shrink:0}
.error-box{background:#fff0f0;color:#a02020;border:1px solid #f5c6c6;border-radius:8px;
  padding:12px 14px;font-size:13px;margin-bottom:1.5rem;text-align:left;line-height:1.5}
.footer-note{font-size:11px;color:#99998f;margin-top:1.75rem}
</style>
</head>
<body>
<div class="card">
  <img src="/static/kata_logo_square.png" alt="Kata" class="logo" style="border-radius:16px">
  <h1>Kata, planificador de producción</h1>
  <p class="sub">Iniciá sesión con tu cuenta de Google para continuar</p>

  {% if error %}
  <div class="error-box"><i class="ti ti-alert-triangle"></i> {{ error }}</div>
  {% endif %}

  <a href="/auth/google" class="google-btn">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4c-2 1.4-4.6 2.3-7.7 2.3-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.4 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
    </svg>
    Continuar con Google
  </a>

  <div class="footer-note">Solo pueden ingresar cuentas autorizadas por el administrador.</div>
</div>
</body>
</html>
